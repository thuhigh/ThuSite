<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fcfcfd;--surf:#f4f4f6;--surf2:#ececef;--on:#111113;--var:#5c5d66;--pri:#111113;--onpri:#fff;--pc:#fff;--onpc:#111113;--sec:#ececef;--err:#c62828;--out:#e4e4e8;--st:#2563eb;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e0e10;--surf:#17171a;--surf2:#202024;--on:#f4f4f5;--var:#a1a1aa;--pri:#f4f4f5;--onpri:#111113;--pc:#141416;--onpc:#f4f4f5;--sec:#202024;--err:#f2b8b5;--out:#2a2a2f;--st:#6e9bff;--card:#141416}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e0e10;--surf:#17171a;--surf2:#202024;--on:#f4f4f5;--var:#a1a1aa;--pri:#f4f4f5;--onpri:#111113;--pc:#141416;--onpc:#f4f4f5;--sec:#202024;--err:#f2b8b5;--out:#2a2a2f;--st:#6e9bff;--card:#141416}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on);font:16px/1.5 "Google Sans","Segoe UI",Roboto,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg)}
.brand{font-weight:800;font-size:20px;color:var(--pri);letter-spacing:-.5px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:8px 16px;border-radius:999px;color:var(--var);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a.on{background:var(--pc);color:var(--onpc)}
.seg{display:inline-flex;background:var(--surf2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--var);font:700 13px inherit;font-family:inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri)}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
section{display:none}section.on{display:block;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{background:var(--pc);color:var(--onpc);border-radius:40px 40px 40px 12px;padding:32px 24px;margin-top:8px}
.avatar{width:84px;height:84px;border-radius:30px 30px 30px 10px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:800 34px inherit;font-family:inherit}
h1{font-size:clamp(32px,8vw,52px);line-height:1.05;margin:16px 0 6px;letter-spacing:-1px}
h2{font-size:22px;margin:28px 0 12px}
p{margin:0;color:inherit}.muted{color:var(--var)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:0;border-radius:999px;padding:12px 22px;font:700 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block;background:var(--pri);color:var(--onpri)}
.btn.t{background:var(--sec);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surf);border-radius:28px;padding:20px}
.stat b{display:block;font-size:30px;letter-spacing:-1px;color:var(--pri)}
.stat span{color:var(--var);font-size:14px}
.empty{text-align:center;padding:36px 16px;background:var(--surf);border-radius:28px;color:var(--var)}
.empty i{font-size:36px;display:block;font-style:normal;margin-bottom:6px}
.search{width:100%;border:2px solid transparent;background:var(--surf2);color:var(--on);border-radius:999px;padding:14px 22px;font:inherit;outline:0}
.search:focus{border-color:var(--pri)}
.item{display:flex;align-items:center;gap:14px;background:var(--surf);border-radius:24px;padding:16px;margin-top:10px;color:inherit;text-decoration:none}
.item .ic{width:44px;height:44px;border-radius:16px;background:var(--sec);display:grid;place-items:center;font-weight:800;color:var(--pri)}
.item small{color:var(--var);display:block}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surf);border-radius:24px;padding:16px 20px;margin-top:10px}
footer{text-align:center;color:var(--var);font-size:13px;padding:24px 16px}

html{scrollbar-color:var(--out) transparent;background:var(--bg)}
body{font-family:var(--f-b);line-height:1.55;background:var(--bg);color:var(--on);-webkit-font-smoothing:antialiased}
::selection{background:var(--on);color:var(--bg)}
input{caret-color:var(--on)}
:focus-visible{outline:2px solid var(--on);outline-offset:2px}
body::before,.hero::after,.card::before,.item::before{display:none}
header{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--out)}
.brand{font-family:var(--f-d);color:var(--on);font-weight:700;font-size:20px;letter-spacing:-.04em;background:none;-webkit-background-clip:border-box}
nav a{font-weight:500;font-size:14px;color:var(--var);border-radius:10px;padding:8px 14px;transition:background .15s,color .15s}
nav a:hover{background:var(--surf);color:var(--on)}nav a.on{background:var(--pri);color:var(--onpri)}
.seg{background:var(--surf);border:1px solid var(--out);padding:2px;border-radius:10px;overflow:visible}
.seg button{border-radius:8px;padding:6px 12px;font-weight:600;color:var(--var)}.seg button+button{border-left:0}
.seg button.on{background:var(--pri);color:var(--onpri)}
.btn{background:var(--pri);color:var(--onpri);border:1px solid var(--pri);border-radius:10px;font-weight:600;font-size:14px;padding:11px 20px;box-shadow:none;transition:opacity .15s,background .15s}
.btn:hover{opacity:.88;transform:none;box-shadow:none}
.btn.t,.hero .btn.t{background:var(--card)!important;color:var(--on)!important;border:1px solid var(--out)}.btn.t:hover{background:var(--surf)!important;opacity:1}
h1,h2{font-family:var(--f-d);font-weight:600;letter-spacing:-.03em}
h2{font-size:20px;margin:40px 0 14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 208px;column-gap:40px;align-items:center;background:var(--card);color:var(--on);border:1px solid var(--out);border-radius:24px;padding:48px 44px;box-shadow:var(--sh);margin-top:20px}
.hero>*{grid-column:1}
.hero h1{font-size:clamp(44px,9vw,80px);line-height:1;letter-spacing:-.045em;margin:0 0 16px}
.hero p{color:var(--var);font-size:18px;max-width:34ch}
.hero .row{margin-top:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chips span{background:var(--surf);border:1px solid var(--out);color:var(--on);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;backdrop-filter:none}
.chips .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.avatar,.hero .avatar{background:var(--surf) var(--av) center/cover;color:transparent!important;font-size:0!important;border:1px solid var(--out);box-shadow:none;border-radius:16px}
.hero .avatar{grid-column:2;grid-row:1/6;width:208px;height:208px;border-radius:20px}
.card,.item,.set,.empty{background:var(--card);border:1px solid var(--out);border-radius:16px;box-shadow:var(--sh);backdrop-filter:none;-webkit-backdrop-filter:none}
.card:hover,.item:hover{background:var(--card);border-color:color-mix(in srgb,var(--on) 28%,var(--out));transform:none;box-shadow:var(--sh)}
.empty{border-style:dashed;box-shadow:none;background:transparent;color:var(--var)}
.empty i{filter:grayscale(1);opacity:.55}
#stats{grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--out);border-radius:16px;background:var(--card);box-shadow:var(--sh);overflow:hidden}
#stats .card{border:0;border-radius:0;box-shadow:none;background:none;padding:24px}
#stats .card+.card{border-left:1px solid var(--out)}
.stat b{font-family:var(--f-d);background:none;-webkit-background-clip:border-box;color:var(--on);font-weight:600;font-size:clamp(22px,5.5vw,30px);letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#stats .stat b{font-size:clamp(26px,6vw,40px)}
.stat span{color:var(--var);font-size:13px;font-weight:500}
.item .ic{background:var(--surf);color:var(--on);border-radius:12px;font-weight:700}
.search{background:var(--card);border:1px solid var(--out);border-radius:12px;padding:13px 18px;backdrop-filter:none;box-shadow:var(--sh)}
.search:focus{border-color:var(--on);box-shadow:0 0 0 1px var(--on)}
#toast{background:var(--on);color:var(--bg);border-radius:12px;font-weight:500;padding:12px 18px 12px 38px;box-shadow:0 8px 28px -8px rgba(0,0,0,.4)}
#toast::before{content:"";position:absolute;left:18px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--st)}
#toast.err{background:var(--on);color:var(--bg)}#toast.err::before{background:#e5484d}
footer{border-top:1px solid var(--out);margin-top:24px;padding:28px 16px}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}.reveal.in{opacity:1;transform:none}

.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:32px;align-items:end;min-height:440px;padding:36px 32px 32px;border:0;border-radius:28px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.45) 38%,#000 100%),var(--cv) center 22%/cover;box-shadow:var(--sh);margin-top:20px}
.hero>*{grid-column:auto}
.hero-main{min-width:0}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:12px}
.hero h1{display:flex;align-items:center;gap:10px;font-size:clamp(40px,10vw,68px);font-weight:700;letter-spacing:-.04em;margin:0;color:#fff;line-height:1.05}
.caret{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #fff;margin-top:12px;flex:none}
.handle{color:#b8b8c0;font-weight:500;font-size:18px;margin:6px 0 24px}
#stats.pstats{display:flex;flex-wrap:wrap;gap:12px 32px;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible}
.pst b{display:block;font-family:var(--f-d);font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.pst span{color:#b8b8c0;font-size:14px;font-weight:500}
.hero p{color:#e9e9ee;font-size:16px;max-width:36ch;margin-top:22px}
.hero .row{margin-top:20px}
.hero .btn{background:#fff;color:#111113;border-color:#fff}
.hero .btn.t,.hero .btn.t:hover{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)}
.hero .chips{margin:20px 0 0}.hero .chips span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.avatar-wrap{position:relative;width:168px;height:168px}
.hero .avatar{width:168px;height:168px;border-radius:50%;border:4px solid rgba(255,255,255,.6);background:#1a2a3a var(--av) center/cover;box-shadow:0 0 0 4px rgba(0,0,0,.35);margin:0}
.plus{position:absolute;right:2px;bottom:2px;width:38px;height:38px;border-radius:50%;background:#20d5ec;color:#fff;font:600 26px/32px var(--f-d);text-align:center;text-decoration:none;border:3px solid #0b0b0d}
.note{background:rgba(48,48,52,.92);color:#d4d4da;border-radius:18px;padding:10px 16px;font-size:14px;max-width:160px;text-align:center;line-height:1.3}
@media (max-width:640px){.hero{grid-template-columns:1fr;min-height:420px;align-content:space-between;padding:20px;row-gap:20px}.hero-side{order:-1;justify-self:end}.note{display:none}.avatar-wrap,.hero .avatar{width:104px;height:104px}.plus{width:30px;height:30px;font-size:20px;line-height:24px}#stats.pstats{gap:12px 22px}.pst b{font-size:24px}}
.upd{color:#b8b8c0;font-size:12px;margin-top:10px}
.q{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}.q b{font-family:var(--f-d);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.prof{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.prof h1{font-size:26px;margin:0}
.pav{width:88px;height:88px;border-radius:50%;border:3px solid var(--out);box-shadow:0 0 0 3px var(--bg);background:var(--surf) center/cover no-repeat;display:grid;place-items:center;font:700 32px var(--f-d);color:var(--var);flex:none}
.rcs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}.rcs:empty{display:none}
.rc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--out);background:var(--card);color:var(--on);border-radius:999px;padding:4px 14px 4px 4px;font:500 13px var(--f-b);cursor:pointer;white-space:nowrap}.rc:hover{background:var(--surf)}
.rav{width:28px;height:28px;border-radius:50%;background:var(--surf) center/cover no-repeat;display:grid;place-items:center;font:700 13px var(--f-d);font-style:normal}
#vout .grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fld{display:grid;gap:6px;margin-top:14px;font-size:14px;font-weight:500;color:var(--var)}.fld:first-child{margin-top:0}
.dl{font-style:normal;font-size:12px;font-weight:600;color:#9bbcff;background:rgba(37,99,235,.3);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.cl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--var);margin-top:8px}.cl b{color:var(--on);font-size:14px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vc{all:unset;cursor:pointer;display:block;border:1px solid var(--out);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}.vc:focus-visible{outline:2px solid var(--on);outline-offset:2px}.vc:hover{border-color:var(--var)}
.vt{display:grid;place-items:center;aspect-ratio:9/12;background:var(--surf) center/cover no-repeat}
.pl{font-style:normal;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px}
.vm{display:block;padding:10px 12px}.vm b{display:block;font-size:15px}.vm small{color:var(--var);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:20;padding:64px 16px 16px}.modal[hidden]{display:none}
.mb{position:relative;width:min(340px,100%)}.mb iframe{width:100%;height:min(600px,78vh);border:0;border-radius:16px;background:#000}.mb .btn{position:absolute;right:0;top:-50px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg .btn{grid-column:1/-1}.cg2{display:grid;grid-template-columns:1fr auto;gap:8px}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px 8px;align-items:center;font-size:14px}.cmp>span{padding:8px 6px;border-radius:10px;text-align:center;font-variant-numeric:tabular-nums}

let tr={s:'idle'};
function renderTrend(){const el=$('#trres');if(!el)return;const box=(i,m)=>`<div class="empty"><i>${i}</i>${m}</div>`,nf=new Intl.NumberFormat(loc(),{notation:'compact'});
 const links=q=>`<div class="row" style="margin-top:14px">${q?`<a class="btn" href="https://www.tiktok.com/tag/${encodeURIComponent(q)}" target="_blank" rel="noopener">${t('tr.open')}</a><a class="btn t" href="https://www.tiktok.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${t('tr.search')}</a>`:''}<a class="btn t" href="https://ads.tiktok.com/business/creativecenter/inspiration/popular/hashtag/pc/en" target="_blank" rel="noopener">${t('tr.center')}</a></div>`;
 if(tr.s==='idle')return el.innerHTML=box('📈',t('tr.hint'))+links('');
 if(tr.s==='load')return el.innerHTML=box('⏳',t('tt.loading'));
 if(tr.s==='err')return el.innerHTML=box('⚠️',t(tr.e));
 const d=tr.d;
 el.innerHTML=`<div class="card"><h1 style="font-size:26px;margin:0">#${esc(d?d.title:tr.q)}</h1>${d&&d.desc?`<p class="muted" style="margin-top:6px">${esc(d.desc)}</p>`:''}</div>`+(d?`<div class="grid" style="margin-top:12px"><div class="card stat"><b>${nf.format(d.viewCount)}</b><span>${t('tr.views')}</span></div><div class="card stat"><b>${nf.format(d.videoCount)}</b><span>${t('tr.videos')}</span></div><div class="card stat"><b>${d.videoCount?nf.format(d.viewCount/d.videoCount):'—'}</b><span>${t('tr.avg')}</span></div></div>`:`<p class="muted" style="margin-top:12px">${t('tr.nostat')}</p>`)+links(tr.q)}
async function searchTrend(){const q=$('#trq').value.trim().replace(/^#/,'').replace(/\s+/g,'').toLowerCase();
 if(cool())return;
 if(!/^[\p{L}\p{N}_]{1,40}$/u.test(q)){tr={s:'err',e:'e.bad2'};return renderTrend()}
 startCool();tr={s:'load'};renderTrend();
 let d=null;if(WORKER_URL){try{const r=await fetch(WORKER_URL+'?tag='+encodeURIComponent(q));if(r.ok)d=await r.json();else if(r.status===429){const j=await r.json().catch(()=>({}));next=Date.now()+(j.retryAfter||180)*1000;tick();toast(t('e.wait').replace('{t}',fmt(Math.ceil((next-Date.now())/1000))),true);tr={s:'idle'};return renderTrend()}}catch(e){}}
 tr={s:'ok',d,q};renderTrend()}
const NICHE={ent:1,beauty:1.3,game:1.2,tech:1.6,fin:2};
function calcVal(){const out=$('#vout');if(!out)return;const f=+$('#vf').value,v=+$('#vv').value,l=+$('#vl').value,n=NICHE[$('#vn').value]||1;
 if(!(f>0&&v>0)){out.innerHTML=`<div class="empty"><i>🧮</i>${t('v.empty')}</div>`;return}
 const er=l>0?Math.min(l/v,1):null,erf=er==null?1:er>.08?1.2:er<.03?.8:1,post=v/1000*10*n*erf,lo=f*.01*n,hi=f*.04*n*erf;
 const m=x=>lang==='vi'?new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(x*USD_VND):new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(x);
 out.innerHTML=`<div class="grid"><div class="card stat"><b>${m(post)}</b><span>${t('v.post')}</span></div><div class="card stat"><b>${m(lo)} – ${m(hi)}</b><span>${t('v.value')}</span></div><div class="card stat"><b>${er==null?'—':new Intl.NumberFormat(loc(),{style:'percent',maximumFractionDigits:1}).format(er)}</b><span>${t('v.er')}</span></div></div><p class="muted" style="margin-top:12px;font-size:13px">${t('v.note')}</p>`}
function fillVal(){const d=tt.s==='ok'?tt.d:DB&&DB.accounts&&DB.accounts['thu.highhh'];if(!d||!d.profile)return toast(t('e.nodata'),true);
 const vs=d.videos||[];$('#vf').value=d.profile.followers||'';$('#vv').value=d.medianViews||'';$('#vl').value=vs.length?Math.round(vs.reduce((a,x)=>a+x.likes,0)/vs.length):'';calcVal()}
const money=x=>lang==='vi'?new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(x*USD_VND):new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(x);
const U=x=>x.trim().replace(/^@/,'').toLowerCase(),okU=u=>/^[\w.]{2,24}$/.test(u);
function hist(){return DB&&DB.history&&DB.history['thu.highhh']||[]}
function delta(k){const h=hist();if(h.length<2)return null;const last=h[h.length-1],cut=Date.now()-864e5;let base=h[0];for(const p of h){if(+new Date(p.t)<=cut)base=p;else break}return last[k]-base[k]}
function renderChart(){const el=$('#chart');if(!el)return;const h=hist().slice(-60);
 if(h.length<2)return el.innerHTML=`<div class="muted" style="text-align:center;padding:20px 8px">${t('g.empty')}</div>`;
 const W=640,Hh=180,P=8,xs=h.map(p=>+new Date(p.t)),ys=h.map(p=>p.f),x0=xs[0],x1=xs[xs.length-1],y0=Math.min(...ys),dy=(Math.max(...ys)-y0)||1,
 X=v=>P+(v-x0)/((x1-x0)||1)*(W-2*P),Y=v=>Hh-P-(v-y0)/dy*(Hh-2*P),pts=h.map(p=>X(+new Date(p.t)).toFixed(1)+','+Y(p.f).toFixed(1)),nf=new Intl.NumberFormat(loc()),df=new Intl.DateTimeFormat(loc(),{dateStyle:'medium'});
 el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${t('g.title')}" style="width:100%;height:auto;display:block"><polygon points="${X(x0).toFixed(1)},${Hh-P} ${pts.join(' ')} ${X(x1).toFixed(1)},${Hh-P}" fill="var(--on)" opacity=".06"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--on)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(x1).toFixed(1)}" cy="${Y(ys[ys.length-1]).toFixed(1)}" r="5" fill="var(--st)"/></svg><div class="cl"><span>${df.format(x0)}</span><b>${nf.format(ys[ys.length-1])}</b><span>${df.format(x1)}</span></div>`}
function openVid(id){$('#vfr').src='https://www.tiktok.com/embed/v2/'+encodeURIComponent(id);$('#vm').hidden=false;$('#vx').focus()}
function closeVid(){$('#vfr').src='about:blank';$('#vm').hidden=true}
let DCI={};
function renderDC(){const el=$('#dc');if(!el)return;const inv=DISCORD.invite||DCI.inv,st=DISCORD.id&&DCI.on!=null?`<i class="sdot"></i>${new Intl.NumberFormat(loc()).format(DCI.on)} ${t('dc.online')}`:`<i class="sdot"></i>${t('soon')}`;
 el.innerHTML=`<div class="dcr"><div><b>Discord</b><p class="dcs">${st}</p></div>${inv?`<a class="btn" href="${esc(inv)}" target="_blank" rel="noopener">${t('dc.join')}</a>`:`<button class="btn" disabled>${t('dc.join')}</button>`}</div>`}
async function loadDC(){if(!DISCORD.id)return;try{const r=await fetch('https://discord.com/api/guilds/'+DISCORD.id+'/widget.json');if(r.ok){const j=await r.json();DCI={on:j.presence_count,inv:j.instant_invite}}}catch(e){}renderDC()}
async function getChan(us){if(!WORKER_URL){toast(t('e.net'),true);return null}
 try{const r=await fetch(WORKER_URL+'?users='+us.map(encodeURIComponent).join(','));
  if(r.status===429){const j=await r.json().catch(()=>({}));next=Date.now()+(j.retryAfter||180)*1000;tick();toast(t('e.wait').replace('{t}',fmt(Math.ceil((next-Date.now())/1000))),true);return null}
  if(r.status===404){toast(t('e.nodata'),true);return null}
  if(!r.ok){toast(t('e.net'),true);return null}
  return await r.json()}catch(e){toast(t('e.net'),true);return null}}
let cmp=null;
async function doCmp(){const a=U($('#cqa').value),b=U($('#cqb').value);if(cool())return;if(!okU(a)||!okU(b)||a===b){toast(t('e.bad'),true);return}
 startCool();$('#cres').innerHTML=`<div class="empty"><i>⏳</i>${t('tt.loading')}</div>`;const j=await getChan([a,b]);cmp=j&&j.channels;renderCmp()}
function renderCmp(){const el=$('#cres');if(!el)return;if(!cmp)return;const nf=new Intl.NumberFormat(loc(),{notation:'compact'}),pf=new Intl.NumberFormat(loc(),{style:'percent',maximumFractionDigits:1}),[A,B]=cmp;
 const er=d=>{const v=d.videos||[],s=v.reduce((a,x)=>a+x.views,0);return s?v.reduce((a,x)=>a+x.likes,0)/s:null};
 const rows=[['stats.followers',d=>d.profile&&d.profile.followers,v=>nf.format(v)],['stats.likes',d=>d.profile&&d.profile.likes,v=>nf.format(v)],['tt.median',d=>d.medianViews,v=>nf.format(v)],['tt.er',er,v=>pf.format(v)],['v.post',d=>d.estUsd,money]];
 const hd=d=>`<div class="ch"><i class="rav big" style="background-image:${avOf(d)}">${avOf(d)?'':esc(d.username[0].toUpperCase())}</i>@${esc(d.username)}</div>`;
 el.innerHTML=`<div class="card"><div class="cmp"><span></span>${hd(A)}${hd(B)}${rows.map(([k,f,fm])=>{const x=f(A),y=f(B),w=x!=null&&y!=null&&x!==y?(x>y?0:1):-1;return `<span class="cl2">${t(k)}</span><span class="${w===0?'win':''}">${x==null?'—':fm(x)}</span><span class="${w===1?'win':''}">${y==null?'—':fm(y)}</span>`}).join('')}</div></div>`}
async function getVal(){const u=U($('#vu').value);if(!u)return fillVal();if(cool())return;if(!okU(u)){toast(t('e.bad'),true);return}
 startCool();const d=await getChan([u]);if(!d)return;tt={s:'ok',d,u:d.updated};saveRecent(d,d.updated);fillVal()}
async function shareVal(){const o=$('#vout');if(!o||!o.querySelector('.stat'))return toast(t('v.empty'),true);
 const txt=t('v.title')+'\n'+[...o.querySelectorAll('.stat')].map(e=>e.querySelector('span').textContent+': '+e.querySelector('b').textContent).join('\n')+'\n'+location.href.split('#')[0]+'#value';
 try{if(navigator.share)await navigator.share({title:t('v.title'),text:txt});else{await navigator.clipboard.writeText(txt);toast(t('n.copied2'))}}catch(e){if(e&&e.name!=='AbortError')toast(t('e.copy'),true)}}
let VIS=null;
function renderVis(){const el=$('#vis');if(!el||!VIS)return;const nf=new Intl.NumberFormat(loc());el.textContent=t('vis.total')+': '+nf.format(VIS.total)+' · '+t('vis.unique')+': '+nf.format(VIS.unique)+' · '+t('vis.today')+': '+nf.format(VIS.today)}
async function loadVisits(){if(!WORKER_URL)return;let q='?visit=1';
 try{if(!sessionStorage.getItem('thusite.s')){q+='&hit=1';sessionStorage.setItem('thusite.s','1')}if(!localStorage.getItem('thusite.v')){q+='&new=1';localStorage.setItem('thusite.v','1')}}catch(e){}
 try{const r=await fetch(WORKER_URL+q);if(r.ok){VIS=await r.json();renderVis()}}catch(e){}}
function renderTT(){const el=$('#ttres');if(!el)return;
 const nf=new Intl.NumberFormat(loc()),box=(i,m)=>`<div class="empty"><i>${i}</i>${m}</div>`;
 if(tt.s==='idle')return el.innerHTML=box('🔎',t('tt.hint'));
 if(tt.s==='load')return el.innerHTML=box('⏳',t('tt.loading'));
 if(tt.s==='err')return el.innerHTML=box('⚠️',t(tt.e).replace('{t}',tt.x||''));
 const d=tt.d,p=d.profile||{},df=new Intl.DateTimeFormat(loc(),{dateStyle:'medium'}),vs=d.videos||[],sv=vs.reduce((a,x)=>a+x.views,0),er=sv?vs.reduce((a,x)=>a+x.likes,0)/sv:null,pf=new Intl.NumberFormat(loc(),{style:'percent',maximumFractionDigits:1});
 const money=d.estUsd==null?'—':lang==='vi'?new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(d.estVnd):new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(d.estUsd);
 el.innerHTML=`<div class="card prof"><div class="pav" style="background-image:${avOf(d)}">${avOf(d)?'':esc((p.nickname||d.username)[0].toUpperCase())}</div><div style="flex:1;min-width:0"><h1>${esc(p.nickname||d.username)}</h1><p class="muted">@${esc(d.username)}</p></div><a class="btn t" href="https://www.tiktok.com/@${esc(d.username)}" target="_blank" rel="noopener">${t('btn.open')}</a></div>
 <div class="grid" style="margin-top:12px">${[['stats.followers',p.followers],['stats.likes',p.likes],['tt.median',d.medianViews]].map(([k,v])=>`<div class="card stat"><b>${v==null?'—':nf.format(v)}</b><span>${t(k)}</span></div>`).join('')}<div class="card stat"><b>${er==null?'—':pf.format(er)}</b><span>${t('tt.er')}</span></div><div class="card stat"><b>${money}</b><span>${t('tt.est')}</span></div></div>
 <p class="muted" style="margin-top:10px">${t('tt.updated')}: ${tt.u?new Intl.DateTimeFormat(loc(),{dateStyle:'medium',timeStyle:'short'}).format(new Date(tt.u)):'—'}</p><h2>${t('tt.latest')}</h2>${d.videos.length?d.videos.map(v=>`<a class="item" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="ic">▶</div><div><b>${nf.format(v.views)} ${t('stats.views')} · ${nf.format(v.likes)} ${t('stats.likes')}</b><small>${df.format(new Date(v.time*1000))}</small></div></a>`).join(''):box('🎬',t('tt.novid'))}`}
